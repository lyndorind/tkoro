name: Lab 6 - Publish image to Quay.io

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.QUAY_IMAGE }}
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v6

      - name: Log in to Quay.io using robot account
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
