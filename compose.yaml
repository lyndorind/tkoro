services:
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: lab7
      POSTGRES_DB: lab7
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab7 -d lab7"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .

    image: quay.io/lyndorind/tkoro:${IMAGE_TAG:-lab7}

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: lab7
      DB_USER: lab7
      DB_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
